<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MusicHub</title>

    <!-- Internal CSS for styling -->
    <style>
        
        /* Reset and Body */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        

        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            display: grid;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
           .navbar {
  height: 70px;
  display: flex;
  align-items: center;
  background-color: rgb(0, 0, 0);
  position: fixed;
  width:100%;
  top: 0;
  box-sizing: border-box;
  padding: 0 20px;
  z-index: 1000;
}

#logo {
  height: 70px;
}

#home {
  height: 50px;
  margin-bottom: 10px;
  border-radius: 50%;
}

.navbar input {
  width: 300px;
  background-color: white;
  margin-left: 10px;
  height: 40px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bolder;
  text-align: center;
  margin-right: 200px;
}

.navbar a {
  text-decoration: none;
  margin-right: 20px;
  font-size: 20px;
  color: white;
  position: relative;
}


.navbar .link::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 0;
  width: 0;
  height: 3px;
  background-color: orangered;
  
  transition: width 0.4s ease, left 0.4s ease;
}

.navbar .link:hover::after {
  width: 100%;
  color: blue;
  left: 0;
  
}

.navbar button {
  color: black;
  background-color: white;
  border-radius: 30px;
  text-align: center;
  width: 80px;
  height: 40px;
  font-weight: bolder;
}
.navbar button:hover{
  transform: scale(1.2);
 background-color: #ff6600;
}
        .signup-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        /* Signup Box */
        .signup-box {
            background: linear-gradient(135deg, rgba(41, 40, 40, 0.8), rgba(13, 13, 13, 0.8));
            border-radius: 15px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
        }
        img{
            height:80px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 28px;
            font-family: 'Caveat', cursive;
            color: white;
        }

        /* Input Fields */
        .textbox {
            margin: 20px 0;
            position: relative;
        }

        .textbox input {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 2px solid #555;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .textbox input:focus {
            border-color: #ff6600;
        }

        /* Button */
        button.btn {
            width: 100%;
            padding: 12px;
            background: #ff6600;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button.btn:hover {
            background: #4c00ff;
        }

        /* Already have an account link */
        .signin-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .signin-link a {
            color: #0000ff;
            text-decoration: none;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .signup-box {
                width: 90%;
                padding: 20px;
            }
            h2 {
                font-size: 24px;
            }
            .textbox input {
                font-size: 16px;
            }
            button.btn {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="images\logo.png" id="logo">

        <a href="index.html"><img src="https://i.pinimg.com/736x/71/89/88/718988215800391b6050182a28ca6810.jpg" id="home"></a>
         <input type="textarea" placeholder="Search your song">
         <a href="premium.html" class="link">Premium Plus</a>
         <a href="support.html" class="link">Support</a>
         <a href="about.html" class="link">About us</a>
         <a>|</a>
         <a href="playlist.html" class="link">Playlist</a>
         <a href="signup.html" class="link">Signup</a>
         <a href="login.html">
         <button type="button">Login</button></a>
    </div>
    <div class="signup-container">
        <div class="signup-box">
            <img src="images\logo.png" alt="Logo">
            <br>
            <h2>Sign Up</h2>
            <form action="#" method="post">
                <div class="textbox">
                    <input type="text" placeholder="Username" name="username" required>
                </div>
                <div class="textbox">
                    <input type="email" placeholder="Email" name="email" required>
                </div>
                <div class="textbox">
                    <input type="password" placeholder="Password" name="password" required>
                </div>
                <div class="textbox">
                    <input type="password" placeholder="Confirm Password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn">Sign Up</button>
                <div class="signin-link">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
